<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steam 卡牌补充包价值优化</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; padding: 2rem; }
        .container { max-width: 1100px; margin: 0 auto; }
        h1 { text-align: center; margin-bottom: 2rem; color: #fff; }
        .search-box { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
        input { padding: 0.75rem 1rem; border: none; border-radius: 8px; font-size: 1rem; width: 300px; background: #16213e; color: #fff; border: 1px solid #0f3460; }
        button { padding: 0.75rem 1.5rem; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; background: #e94560; color: #fff; font-weight: 600; transition: background 0.2s; }
        button:hover { background: #ff6b6b; }
        button:disabled { background: #555; cursor: not-allowed; }
        .meta { text-align: center; margin-bottom: 1rem; color: #aaa; font-size: 0.9rem; }
        .controls { display: flex; gap: 1rem; justify-content: center; margin-bottom: 1rem; flex-wrap: wrap; align-items: center; }
        .controls label { color: #aaa; }
        select { padding: 0.5rem; border-radius: 6px; border: none; background: #16213e; color: #fff; }
        .filter-btn { padding: 0.4rem 1rem; border: none; border-radius: 6px; cursor: pointer; background: #16213e; color: #aaa; font-size: 0.9rem; }
        .filter-btn.active { background: #e94560; color: #fff; }
        table { width: 100%; border-collapse: collapse; background: #16213e; border-radius: 12px; overflow: hidden; }
        th { background: #0f3460; padding: 1rem; text-align: left; cursor: pointer; user-select: none; }
        th:hover { background: #1a4a8a; }
        td { padding: 0.85rem 1rem; border-top: 1px solid #0f3460; }
        tr.profit { background: rgba(46, 213, 115, 0.08); }
        tr.loss { opacity: 0.7; }
        .profit-tag { color: #2ed573; font-weight: 600; }
        .loss-tag { color: #ff6b6b; }
        .loading { text-align: center; padding: 2rem; color: #aaa; }
        .error { text-align: center; padding: 2rem; color: #ff6b6b; }
        .progress { text-align: center; margin-bottom: 1rem; color: #aaa; }
        .info-bar { display: flex; justify-content: space-between; background: #16213e; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; color: #aaa; }
        .info-bar span { color: #fff; }
        footer { text-align: center; margin-top: 2rem; color: #555; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎴 Steam 卡牌补充包价值优化</h1>

        <div class="search-box">
            <input type="text" id="steamId" placeholder="输入 Steam ID（如 76561198000000）" value="">
            <button id="searchBtn" onclick="fetchData()">查询</button>
        </div>

        <div id="meta" class="meta" style="display:none"></div>
        <div id="controls" class="controls" style="display:none">
            <button class="filter-btn active" id="filterAll" onclick="setFilter('all')">全部</button>
            <button class="filter-btn" id="filterProfit" onclick="setFilter('profit')">仅盈利</button>
            <label>排序：</label>
            <select id="sortSelect" onchange="renderTable()">
                <option value="profit_rate">回报率</option>
                <option value="profit_cny">利润</option>
                <option value="game_name">游戏名</option>
            </select>
        </div>

        <div id="progress" class="progress" style="display:none">正在查询...</div>
        <div id="tableContainer"></div>

        <footer>数据来源：Steam Market、SteamGridDB · 价格实时波动，仅供参考</footer>
    </div>

    <script>
        let allGames = [];
        let currentFilter = 'all';
        let gemPrice = 0;

        function formatMoney(v) {
            return '¥' + (v || 0).toFixed(2);
        }
        function formatRate(v) {
            return (v || 0).toFixed(1) + '%';
        }

        async function fetchData() {
            const steamId = document.getElementById('steamId').value.trim();
            if (!steamId) return;

            const btn = document.getElementById('searchBtn');
            const progress = document.getElementById('progress');
            const tableContainer = document.getElementById('tableContainer');
            const meta = document.getElementById('meta');
            const controls = document.getElementById('controls');

            btn.disabled = true;
            progress.style.display = 'block';
            progress.textContent = '正在获取游戏列表...';
            tableContainer.innerHTML = '';
            meta.style.display = 'none';
            controls.style.display = 'none';

            try {
                const resp = await fetch('/api/calculate?steam_id=' + encodeURIComponent(steamId));
                const data = await resp.json();

                if (data.error) {
                    tableContainer.innerHTML = '<div class="error">' + data.error + '</div>';
                    return;
                }

                allGames = data.games || [];
                gemPrice = data.gem_price_cny;

                meta.innerHTML = `用户：<strong>${data.username}</strong> · 1000宝石 = ${formatMoney(gemPrice)} · 共 ${allGames.length} 款游戏有补充包`;
                meta.style.display = 'block';
                controls.style.display = 'flex';

                renderTable();
            } catch (e) {
                tableContainer.innerHTML = '<div class="error">查询失败: ' + e.message + '</div>';
            } finally {
                btn.disabled = false;
                progress.style.display = 'none';
            }
        }

        function setFilter(f) {
            currentFilter = f;
            document.getElementById('filterAll').classList.toggle('active', f === 'all');
            document.getElementById('filterProfit').classList.toggle('active', f === 'profit');
            renderTable();
        }

        function renderTable() {
            const tableContainer = document.getElementById('tableContainer');
            const sortKey = document.getElementById('sortSelect').value;

            let games = [...allGames];
            if (currentFilter === 'profit') {
                games = games.filter(g => g.profit_cny > 0);
            }

            games.sort((a, b) => {
                if (sortKey === 'game_name') return a.game_name.localeCompare(b.game_name);
                return (b[sortKey] || 0) - (a[sortKey] || 0);
            });

            if (games.length === 0) {
                tableContainer.innerHTML = '<div class="loading">没有找到符合条件的游戏</div>';
                return;
            }

            let html = `<table>
                <thead>
                    <tr>
                        <th onclick="sortBy('game_name')">游戏名</th>
                        <th onclick="sortBy('booster_gems')">兑换宝石</th>
                        <th onclick="sortBy('booster_cost_cny')">宝石成本</th>
                        <th onclick="sortBy('card_total_value_cny')">卡牌价值</th>
                        <th onclick="sortBy('profit_cny')">利润</th>
                        <th onclick="sortBy('profit_rate')">回报率</th>
                    </tr>
                </thead>
                <tbody>`;

            for (const g of games) {
                const isProfit = g.profit_cny > 0;
                const profitTag = isProfit
                    ? `<span class="profit-tag">+${formatMoney(g.profit_cny)}</span>`
                    : `<span class="loss-tag">${formatMoney(g.profit_cny)}</span>`;
                const rateTag = isProfit
                    ? `<span class="profit-tag">${formatRate(g.profit_rate)}</span>`
                    : `<span class="loss-tag">${formatRate(g.profit_rate)}</span>`;

                html += `<tr class="${isProfit ? 'profit' : 'loss'}">
                    <td>${g.game_name}</td>
                    <td>${g.booster_gems}</td>
                    <td>${formatMoney(g.booster_cost_cny)}</td>
                    <td>${formatMoney(g.card_total_value_cny)}</td>
                    <td>${profitTag}</td>
                    <td>${rateTag}</td>
                </tr>`;
            }

            html += '</tbody></table>';
            tableContainer.innerHTML = html;
        }

        function sortBy(key) {
            document.getElementById('sortSelect').value = key;
            renderTable();
        }

        // 回车搜索
        document.getElementById('steamId').addEventListener('keydown', e => {
            if (e.key === 'Enter') fetchData();
        });
    </script>
</body>
</html>
